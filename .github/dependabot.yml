version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Australia/Sydney

