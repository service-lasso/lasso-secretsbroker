name: Publish development Broker candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character develop SHA authorized for publication
        required: true
        type: string

concurrency:
  group: broker-development-publication-${{ inputs.candidate_sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVICE_LASSO_HARNESS_REPO: service-lasso/service-lasso-harness
  SERVICE_LASSO_HARNESS_VERSION: v0.1.1
  SECRETSBROKER_PREVIOUS_RELEASE_REPO: service-lasso/lasso-secretsbroker
  SECRETSBROKER_PREVIOUS_RELEASE_VERSION: 2026.8.31-ef26d3c

jobs:
  authorize:
    name: authorize-development-candidate
    permissions:
      contents: read
      actions: read
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bind.outputs.version }}
    steps:
      - name: Bind dispatch to protected develop head
        id: bind
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/develop"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "${CANDIDATE_SHA}" = "${GITHUB_SHA}"
          gh api "repos/$GITHUB_REPOSITORY/environments/development-candidate" > environment.json
          python3 -c 'import json,sys; e=json.load(open("environment.json")); required=[r for r in e.get("protection_rules",[]) if r.get("type")=="required_reviewers"]; reviewers=required[0].get("reviewers",[]) if len(required)==1 else []; ok=e.get("name")=="development-candidate" and isinstance(reviewers,list) and len(reviewers)==1 and reviewers[0].get("type")=="User" and reviewers[0].get("reviewer",{}).get("id")==170312; sys.exit(0 if ok else "Existing development-candidate protection must require only named owner User 170312")'
          version="$(date -u +%Y.%-m.%-d)-${CANDIDATE_SHA:0:7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            artifact: dist/secretsbroker-win32.zip
            sbom: dist/secretsbroker-win32.cdx.json
            archive_name: service-lasso-harness-windows-amd64.zip
            binary_name: service-lasso-harness.exe
            harness_sha256: 3152dad06fa1661bd96f077462de4057f4136b81fb41dabf5aa7fc9a1dc30daa
            previous_archive_name: secretsbroker-win32.zip
            previous_binary_name: secretsbroker.exe
            previous_archive_sha256: 0a268f8c26f90b2a0cdcb9e7b8c248e216490c2de99442b8da043d3b17ec1381
          - os: ubuntu-latest
            platform: linux
            artifact: dist/secretsbroker-linux.tar.gz
            sbom: dist/secretsbroker-linux.cdx.json
            archive_name: service-lasso-harness-linux-amd64.tar.gz
            binary_name: service-lasso-harness
            harness_sha256: 71d59667a82bd4d9a0221b5e822ec722052b96f2168d1b4d7bce5bfce8540cb5
            previous_archive_name: secretsbroker-linux.tar.gz
            previous_binary_name: secretsbroker
            previous_archive_sha256: b7365a34bce2b6ff392c44ba3df8e505e5b6f4642f242b0175d8d2e60e663754
          - os: macos-14
            platform: darwin
            artifact: dist/secretsbroker-darwin.tar.gz
            sbom: dist/secretsbroker-darwin.cdx.json
            archive_name: service-lasso-harness-darwin-arm64.tar.gz
            binary_name: service-lasso-harness
            harness_sha256: 8f9c69057b4eb26902c8e69da7c183fafffc7382f90688b8566769267704673c
            previous_archive_name: secretsbroker-darwin.tar.gz
            previous_binary_name: secretsbroker
            previous_archive_sha256: 21d4fa6518fa77a4d58df4bde9573d16b74b8dc026859d27c8727667acde4654

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod


      - name: Download released service-lasso-harness binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .harness/download .harness/bin
          gh release download "$SERVICE_LASSO_HARNESS_VERSION" \
            --repo "$SERVICE_LASSO_HARNESS_REPO" \
            --pattern "${{ matrix.archive_name }}" \
            --dir .harness/download

      - name: Verify released harness digest before extraction
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/releasechecksums verify-file '${{ matrix.harness_sha256 }}' ".harness/download/${{ matrix.archive_name }}"

      - name: Extract released harness binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path ".harness/download/${{ matrix.archive_name }}" -DestinationPath ".harness/bin" -Force
          $bin = Get-ChildItem ".harness/bin" -Recurse -Filter "${{ matrix.binary_name }}" | Select-Object -First 1
          if (-not $bin) {
            throw "Harness binary not found under .harness/bin"
          }
          $binDir = $bin.Directory.FullName
          $binPath = $bin.FullName
          Add-Content -Path $env:GITHUB_PATH -Value $binDir
          Add-Content -Path $env:GITHUB_ENV -Value "SERVICE_LASSO_HARNESS_BIN=$binPath"

      - name: Extract released harness binary (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf ".harness/download/${{ matrix.archive_name }}" -C .harness/bin
          BIN_PATH="$(find "$PWD/.harness/bin" -type f -name "${{ matrix.binary_name }}" | head -n 1)"
          if [[ -z "$BIN_PATH" || ! -x "$BIN_PATH" ]]; then
            echo "Harness binary not found under .harness/bin" >&2
            exit 1
          fi
          BIN_DIR="$(dirname "$BIN_PATH")"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          echo "SERVICE_LASSO_HARNESS_BIN=$BIN_PATH" >> "$GITHUB_ENV"

      - name: Download and verify compatible previous Broker release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .compat/download .compat/bin
          gh release download "$SECRETSBROKER_PREVIOUS_RELEASE_VERSION" \
            --repo "$SECRETSBROKER_PREVIOUS_RELEASE_REPO" \
            --pattern "${{ matrix.previous_archive_name }}" \
            --dir .compat/download
          go run ./cmd/releasechecksums verify-file '${{ matrix.previous_archive_sha256 }}' ".compat/download/${{ matrix.previous_archive_name }}"

      - name: Extract compatible previous Broker release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath ".compat/download/${{ matrix.previous_archive_name }}" -DestinationPath .compat/bin
          $bin = Get-ChildItem .compat/bin -Recurse -File -Filter "${{ matrix.previous_binary_name }}" | Select-Object -First 1
          if (-not $bin) { throw "Compatible previous Broker binary not found." }
          Add-Content -Path $env:GITHUB_ENV -Value "SECRETSBROKER_PREVIOUS_RELEASE_BINARY=$($bin.FullName)"

      - name: Extract compatible previous Broker release (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf ".compat/download/${{ matrix.previous_archive_name }}" -C .compat/bin
          BIN_PATH="$(find "$PWD/.compat/bin" -type f -name "${{ matrix.previous_binary_name }}" | head -n 1)"
          if [[ -z "$BIN_PATH" ]]; then
            echo "Compatible previous Broker binary not found." >&2
            exit 1
          fi
          chmod +x "$BIN_PATH"
          echo "SECRETSBROKER_PREVIOUS_RELEASE_BINARY=$BIN_PATH" >> "$GITHUB_ENV"

      - name: Validate Secrets Broker (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\test.ps1

      - name: Prove strict named-pipe denial for another Windows principal
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\verify-windows-named-pipe-cross-user-ci.ps1

      - name: Validate Secrets Broker (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./scripts/test.sh

      - name: Scan Go source vulnerabilities
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Run gosec static analysis
        shell: bash
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...

      - name: Run Go static analysis
        shell: bash
        run: go vet ./...

      - name: Fuzz persisted security contract corpus
        if: runner.os == 'Linux'
        shell: bash
        run: go test ./cmd/secretsbroker -run=^$ -fuzz=FuzzSecurityContractParsers -fuzztime=15s

      - name: Run race detector
        if: runner.os == 'Linux'
        shell: bash
        run: go test -race ./...

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package.ps1

      - name: Package artifact (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./scripts/package.sh

      - name: Scan packaged Go binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\verify-go-binaries.ps1 -BrokerPath .\dist\secretsbroker-win32\secretsbroker.exe -ResolverPath .\dist\secretsbroker-win32\secretsbroker-resolve.exe -OutputPath .\output\verify\go-vulnerability-binaries.json

      - name: Scan packaged Go binaries (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./scripts/verify-go-binaries.sh ./output/verify/go-vulnerability-binaries.json ./dist/secretsbroker-${{ matrix.platform }}/secretsbroker ./dist/secretsbroker-${{ matrix.platform }}/secretsbroker-resolve

      - name: Verify via released harness (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\verify.ps1

      - name: Verify via released harness (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./scripts/verify.sh

      - name: Upload packaged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secretsbroker-${{ matrix.platform }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.sbom }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload verify artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-${{ matrix.platform }}
          path: output/verify
          if-no-files-found: error
          retention-days: 90

  compatibility:
    needs: authorize
    runs-on: ubuntu-latest
    env:
      SERVICE_LASSO_RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Guarded private maintained-Go build
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-macos11-compat.sh "$RUNNER_TEMP/broker188"
          bash scripts/package-macos11-compat.sh "$RUNNER_TEMP/broker188"
          cp "$RUNNER_TEMP/broker188/artifacts/provenance.json" dist/macos11-toolchain-provenance.json
      - name: Build official and custom native comparison probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/official-go"
          tar -xzf "$RUNNER_TEMP/broker188/go.tar.gz" -C "$RUNNER_TEMP/official-go"
          mkdir -p output/native-probes
          for arch in amd64 arm64; do
            for profile in official custom; do
              if test "$profile" = official; then goroot="$RUNNER_TEMP/official-go/go"; else goroot="$RUNNER_TEMP/broker188/go"; fi
              GOENV=off GOTOOLCHAIN=local GOWORK=off GOFLAGS= GOEXPERIMENT= GOAMD64=v1 CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" GOROOT="$goroot" GOCACHE="$RUNNER_TEMP/probe-cache-$profile" GOMODCACHE="$RUNNER_TEMP/probe-modules" "$goroot/bin/go" build -trimpath -ldflags=-linkmode=internal -o "output/native-probes/$profile-$arch" ./verify/macos11/go-trust-probe.go
            done
          done
          cp output/native-probes/custom-amd64 dist/macos11-go-trust-probe-amd64
          python3 scripts/check-compat-macho.py "$RUNNER_TEMP/broker188/artifacts/secretsbroker" "$RUNNER_TEMP/broker188/artifacts/secretsbroker-resolve" output/native-probes/custom-amd64 output/native-probes/custom-arm64 > output/native-probes/macho.json
          sha256sum output/native-probes/* > output/native-probes/SHA256SUMS.txt
      - name: Scan exact compatibility binaries
        shell: bash
        run: bash scripts/verify-go-binaries.sh output/verify/compat-vulnerabilities.json dist/secretsbroker-darwin-amd64-macos11/secretsbroker dist/secretsbroker-darwin-amd64-macos11/secretsbroker-resolve
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: secretsbroker-compatibility
          path: |
            dist/secretsbroker-darwin-amd64-macos11.tar.gz
            dist/secretsbroker-darwin-amd64-macos11.cdx.json
            dist/service-darwin-amd64-macos11.json
            dist/macos11-toolchain-provenance.json
            dist/macos11-go-trust-probe-amd64
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-trust-probes
          path: output/native-probes
          if-no-files-found: error

  native-trust:
    needs: compatibility
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: amd64
            machine: x86_64
          - os: macos-14
            arch: arm64
            machine: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-trust-probes
          path: output/native-probes
      - name: Native official/custom trust decision comparison
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.machine }}'
          mkdir -p output/native-matrix
          cp verify/macos11/*.mjs output/native-matrix/
          clang verify/macos11/native/apple-trust.c -framework Security -framework CoreFoundation -o output/native-matrix/apple-trust
          chmod +x output/native-probes/*
          # Go signs ARM64 internally; AMD64 retains the official unsigned policy.
          if test '${{ matrix.arch }}' = arm64; then
            for profile in official custom; do codesign --verify --strict "output/native-probes/$profile-arm64"; done
          fi
          node output/native-matrix/prepare-native.mjs
          node output/native-matrix/prepare-fixtures-r2.mjs
          node output/native-matrix/compare.mjs "$PWD/output/native-probes/official-${{ matrix.arch }}" "$PWD/output/native-probes/custom-${{ matrix.arch }}"
          go test ./...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-trust-${{ matrix.arch }}
          path: output/native-matrix
          if-no-files-found: error

  release:
    needs: [authorize, build, compatibility, native-trust]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: development-candidate
    env:
      MACOS11_NATIVE_REVIEWER_ID: 170312
      CANDIDATE_VERSION: ${{ needs.authorize.outputs.version }}
    permissions:
      issues: read
      actions: read
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod


      - name: Download packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          pattern: secretsbroker-*
          merge-multiple: true

      - name: Copy service manifest into release assets
        shell: bash
        run: |
          set -euo pipefail
          cp service.json release-assets/service.json

      - name: Verify actual Big Sur native receipt before any tag creation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/188/comments?per_page=100" > native-comments.json
          python3 scripts/verify-macos11-receipt.py native-comments.json release-assets release-assets/macos11-native-receipt.json

      - name: Generate and verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/releasechecksums write-compat release-assets
          go run ./cmd/releasechecksums verify-compat release-assets

      - name: Attest exact release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/*

      - name: Verify signed provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            secretsbroker-win32.zip
            secretsbroker-linux.tar.gz
            secretsbroker-darwin.tar.gz
            secretsbroker-win32.cdx.json
            secretsbroker-linux.cdx.json
            secretsbroker-darwin.cdx.json
            service.json
            secretsbroker-darwin-amd64-macos11.tar.gz
            secretsbroker-darwin-amd64-macos11.cdx.json
            service-darwin-amd64-macos11.json
            macos11-toolchain-provenance.json
            macos11-go-trust-probe-amd64
            macos11-native-receipt.json
            SHA256SUMS.txt
          )
          for asset in "${assets[@]}"; do
            gh attestation verify "release-assets/$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-development.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" >/dev/null
          done

      - name: Compute release version
        id: version
        shell: bash
        run: |
          version='${{ needs.authorize.outputs.version }}'
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists and is immutable." >&2
            exit 1
          fi
          ref_status=$(curl -sS -o existing-tag.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")
          test "$ref_status" = 404
          # Atomic new lightweight ref; never reuse, force-update or overwrite tags.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.type)" = commit
          gh release create "$tag" \
            release-assets/secretsbroker-win32.zip \
            release-assets/secretsbroker-linux.tar.gz \
            release-assets/secretsbroker-darwin.tar.gz \
            release-assets/secretsbroker-win32.cdx.json \
            release-assets/secretsbroker-linux.cdx.json \
            release-assets/secretsbroker-darwin.cdx.json \
            release-assets/service.json \
            release-assets/SHA256SUMS.txt \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            release-assets/secretsbroker-darwin-amd64-macos11.tar.gz \
            release-assets/secretsbroker-darwin-amd64-macos11.cdx.json \
            release-assets/service-darwin-amd64-macos11.json \
            release-assets/macos11-toolchain-provenance.json \
            release-assets/macos11-go-trust-probe-amd64 \
            release-assets/macos11-native-receipt.json \
            --prerelease \
            --latest=false \
            --notes "Development candidate from $GITHUB_SHA. The explicit Intel macOS 11 compatibility profile uses maintained custom Go 1.26.8 and is pinned to this tag. Native resolution qualification covers canonical Core-enrolled signed Unix IPC SecretRef lookup; both CLI linkage contracts are verified. Legacy OpenClaw exec CLI nonempty resolution remains unqualified and deferred in issue #190 (https://github.com/service-lasso/lasso-secretsbroker/issues/190). No authentication weakening or GA declaration." \
            --generate-notes

      - name: Verify immutable release readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.version }}"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.type)" = commit
          release_json="$(gh release view "$tag" --json tagName,name,targetCommitish,isDraft,isPrerelease,assets)"
          test "$(jq -r '.tagName' <<<"$release_json")" = "$tag"
          test "$(jq -r '.name' <<<"$release_json")" = "$tag"
          test "$(jq -r '.targetCommitish' <<<"$release_json")" = "$GITHUB_SHA"
          test "$(jq -r '.isDraft' <<<"$release_json")" = "false"
          test "$(jq -r '.isPrerelease' <<<"$release_json")" = "true"
          assets=(
            secretsbroker-win32.zip
            secretsbroker-linux.tar.gz
            secretsbroker-darwin.tar.gz
            secretsbroker-win32.cdx.json
            secretsbroker-linux.cdx.json
            secretsbroker-darwin.cdx.json
            service.json
            secretsbroker-darwin-amd64-macos11.tar.gz
            secretsbroker-darwin-amd64-macos11.cdx.json
            service-darwin-amd64-macos11.json
            macos11-toolchain-provenance.json
            macos11-go-trust-probe-amd64
            macos11-native-receipt.json
            SHA256SUMS.txt
          )
          test "$(jq '.assets | length' <<<"$release_json")" -eq "${#assets[@]}"
          for asset in "${assets[@]}"; do
            local_digest="$(sha256sum "release-assets/$asset" | cut -d' ' -f1)"
            remote_digest="$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            remote_size="$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .size' <<<"$release_json")"
            test "$remote_digest" = "sha256:${local_digest}"
            test "$remote_size" -gt 0
          done

          # Verify the public consumer bytes, including the public manifest itself.
          mkdir public-release-assets
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir public-release-assets
          go run ./cmd/releasechecksums verify-compat public-release-assets
          cmp release-assets/SHA256SUMS.txt public-release-assets/SHA256SUMS.txt
